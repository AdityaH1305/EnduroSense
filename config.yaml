# EnduroSense configuration.
# Every tunable number in the project lives here so results are reproducible
# and decisions pending guide review can be changed in one place.

seed: 42

paths:                      # relative to the project root
  raw: data/raw
  processed: data/processed
  features: data/features
  models: models
  results: results

battery:
  pack_wh: 99.9             # DJI TB47D: 4.5 Ah x 22.2 V nominal
  cells: 6                  # informational: 6S LiPo (per-cell voltage = V / 6)
  reserve_v: 22.6           # rest-voltage reserve (~3.77 V/cell); pending guide confirmation
  full_rest_v: 25.0         # a chain whose first rest voltage is at least this counts as starting full

cleaning:
  time_corrections: config/time_corrections.yaml   # documented fixes to 4 mis-logged start times
  voltage_bounds_v: [15.0, 26.5]    # physically possible for a 6S LiPo under load / at rest
  current_bounds_a: [-1.0, 100.0]   # small negatives are sensor offset on the ground
  spike_window: 5                   # samples in the centred rolling median
  voltage_spike_v: 0.5              # voltage deviation from the median that is not explained...
  voltage_spike_current_a: 2.0      # ...by a current change smaller than this => glitch
  current_spike_a: 8.0              # current deviation from the median with...
  current_spike_voltage_v: 0.1      # ...no voltage response smaller than this => glitch
  gap_s: 1.0                        # time step above this is flagged as a recording gap

phases:
  ground_max_alt_m: 1.5             # below this height above take-off = on the ground
  ground_max_current_a: 2.0         # motors off => on the ground, even if the altitude reading drifted
  move_min_ground_speed: 1.5        # m/s; at or above this the drone is travelling (cruise)
  vertical_min_speed: 0.5           # m/s; |vertical speed| above this = climbing / descending
  min_duration_s: 1.0               # shorter phase fragments are merged into their neighbour
  distance_min_ground_speed: 0.5    # m/s; slower GPS movement is treated as position noise

chains:
  tol_v: 0.3                # symmetric tolerance used by the Phase 0 profile (01_profile_data.py)
  # Phase 1 linking uses motors-off rest voltages and an asymmetric window on
  # jump = this flight's rest start - previous flight's rest end. A resting
  # battery only recovers voltage, so a clear drop means a different battery.
  link_window_v: [-0.10, 0.40]
  confident_window_v: [-0.05, 0.30]   # links outside this (but inside the window) are flagged uncertain
  sensitivity_windows_v: [[-0.10, 0.30], [-0.10, 0.40], [-0.10, 0.50], [-0.30, 0.30]]
  near_reserve_margin_v: 0.3        # chain ends within this of reserve_v => usable for Model A labels
  overrides: config/chain_overrides.yaml

wind:
  airborne_min_alt_m: 2.0           # above take-off height, counts as airborne
  stationary_max_ground_speed: 0.5  # m/s; below this the drone is not moving sideways
  stationary_min_alt_m: 10.0        # clear of ground effect when sampling ambient wind

split:
  test_frac: 0.2
  cv_folds: 5
  version: v2               # v1 (2026-10-01) was invalidated by the start-time ordering fix (2026-10-02)
  file: data/splits/split_v2.json
  force_test_routes: [R6]     # longest route (~820 m cruise): unseen-distance test at final evaluation
  candidates: 5000            # random group splits scored; the best-balanced one is kept

model_a:
  sample_hz: 1                      # training rows per second of flight (readings are ~8 Hz)
  windows_s: [10, 30]               # causal rolling-feature windows (look back only)
  r_int_window_s: 30                # window for the internal-resistance estimate
  r_int_min_current_var: 1.0        # A^2; less current variation than this => resistance not estimable
  r_int_clip_ohm: [0.0, 0.5]
  slope_fit_band_v: [22.4, 24.0]    # discharge slope dV/dE is fitted as a + b*V on dev-chain segments in this band
  slope_clip_v_per_wh: [0.025, 0.055]  # measured range of the slope; keeps the fitted line physical outside the band
  slope_min_segment_wh: 5.0         # rest-point pairs closer than this are too noisy for slope fitting
  seq_hz: 2                         # sequence-model input rate
  seq_len: 120                      # 60 s of history at 2 Hz

model_a_training:
  target: remaining_wh
  search_trials: {random_forest: 10, xgboost: 30}   # random hyperparameter search, scored by grouped CV
  nn_grid: {hidden: [32, 64], layers: [1, 2], dropout: [0.1, 0.3]}
  nn: {lr: 0.001, weight_decay: 0.0001, batch: 256, max_epochs: 60, patience: 8, huber_delta_wh: 2.0}
  latency_repeats: 1000

model_b:
  min_leg_s: 3.0                   # cruise runs shorter than this are fragments, not legs
  max_speed_ratio: 1.05             # legs flown faster than this x commanded (repositioning) are flagged, not trained on
  exclude_varying_altitude: true    # 2 flights climb during cruise; their climb/descent targets are not comparable
  physics_first_margin: 0.05        # use a physics-structured part unless a pure-ML part has >5% lower CV error

uncertainty:
  interval: 0.90                    # headline range reported everywhere
  # probability levels at which predictive distributions are stored; the tail levels
  # (1%, 2.5%, 97.5%, 99%) matter for the 95% decision threshold
  quantiles: [0.01, 0.025, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
              0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.975, 0.99]
  ensemble_size: 5                  # GRUs in the Model A deep ensemble
  ensemble_kind: gru                # main Model A from Phase 3
  mission_method: parts             # Model B: replay per-part errors jointly ("total" = one % error on the mission)
  # small-sample widening of the ranges, with G = number of battery chains used to calibrate:
  #   none   - group-weighted quantiles as they are (coverage matches the nominal level on held-out chains)
  #   smooth - level q -> q(1 + 1/G): the usual conformal guarantee, ~4 points over-coverage here
  #   ceil   - level q -> ceil((G + 1)q)/G: most conservative, ranges ~70% wider
  finite_sample_correction: none

decision:
  tau: 0.95                 # approve a mission only if P(success) >= tau; pending guide confirmation
